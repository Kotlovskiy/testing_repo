<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Книга рецептов</title>
    <link rel="stylesheet" href="src/styles/main.css">
    <link rel="stylesheet" href="src/styles/components.css">
    <link rel="stylesheet" href="src/styles/responsive.css">
</head>
<body>
    <div class="app">
        <header class="app-header">
            <h1>Книга рецептов</h1>
            <nav class="app-nav">
                <button class="nav-btn active" data-page="products">Продукты</button>
                <button class="nav-btn" data-page="dishes">Блюда</button>
            </nav>
        </header>
        
        <main class="app-main" id="app-main">
            <!-- Контент будет динамически загружаться -->
            <div class="loading">Загрузка...</div>
        </main>
    </div>

    <!-- Модальное окно для уведомлений -->
    <div class="modal" id="notification-modal" style="display: none;">
        <div class="modal-overlay"></div>
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h3 id="notification-title">Уведомление</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <p id="notification-message"></p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary modal-close">OK</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно для подтверждения -->
    <div class="modal" id="confirm-modal" style="display: none;">
        <div class="modal-overlay"></div>
        <div class="modal-content modal-small">
            <div class="modal-header">
                <h3 id="confirm-title">Подтверждение</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <p id="confirm-message"></p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary modal-close">Отмена</button>
                <button class="btn btn-danger" id="confirm-ok">Подтвердить</button>
            </div>
        </div>
    </div>

    <!-- Модальное окно для форм -->
    <div class="modal" id="form-modal" style="display: none;">
        <div class="modal-overlay"></div>
        <div class="modal-content modal-large">
            <div class="modal-header">
                <h3 id="form-title">Форма</h3>
                <button class="modal-close">&times;</button>
            </div>
            <div class="modal-body" id="form-body">
                <!-- Форма будет динамически вставляться -->
            </div>
        </div>
    </div>

    <script type="module" src="src/app.ts"></script>
</body>
</html>
