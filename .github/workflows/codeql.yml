name: CodeQL Security Analysis

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to scan'
        required: true
        default: 'back'
        type: choice
        options:
          - front
          - back
          - ci-cd
  pull_request:
    branches: ["front", "back"]
  push:
    branches: ["front", "back"]

permissions:
  contents: read
  security-events: write

jobs:
  codeql-analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch || github.ref_name }}
        fetch-depth: 2

    # Установка .NET (если папка back существует)
    - name: Setup .NET
      if: ${{ hashFiles('**/*.csproj', '**/*.sln') != '' }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          6.0.x
          8.0.x

    # Установка Node.js (если папка front существует)
    - name: Setup Node.js
      if: ${{ hashFiles('**/package.json') != '' }}
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    # Установка зависимостей для TypeScript
    - name: Install dependencies
      if: ${{ hashFiles('**/package.json') != '' }}
      run: |
        cd front  # или куда у вас установлен package.json
        npm ci
      continue-on-error: true

    # Восстановление .NET зависимостей
    - name: Restore .NET dependencies
      if: ${{ hashFiles('**/*.csproj', '**/*.sln') != '' }}
      run: |
        dotnet restore
      continue-on-error: true

    # 👇👇👇 ЗДЕСЬ ВСТАВИТЬ ИНИЦИАЛИЗАЦИЮ CodeQL 👇👇👇
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: javascript-typescript, csharp
        queries: security-extended

    # Авто-билд (CodeQL сам найдет что собирать)
    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    # Выполнение анализа
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:javascript-typescript,csharp"
        upload: false

    # Сохранение результатов
    - name: Upload SARIF artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: codeql-results-${{ github.ref_name }}
        path: results/*.sarif

    # Загрузка в GitHub Security tab
    - name: Upload to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: results/*.sarif
