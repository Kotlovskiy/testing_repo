name: CodeQL Security Analysis

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to scan'
        required: true
        default: 'back'
        type: choice
        options:
          - front
          - back
  pull_request:
    branches: ["front", "back"]
  push:
    branches: ["front", "back"]

permissions:
  contents: read
  security-events: write

jobs:
  codeql-analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.inputs.branch || github.ref_name }}
        fetch-depth: 2

    # 👇👇👇 ВСТАВИТЬ ЭТОТ БЛОК ВНУТРЬ STEPS 👇👇👇
    # Установка .NET (только для back ветки)
    - name: Setup .NET
      if: ${{ github.ref_name == 'back' || github.event.inputs.branch == 'back' }}
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          6.0.x
          8.0.x

    # Установка Node.js (только для front ветки)
    - name: Setup Node.js
      if: ${{ github.ref_name == 'front' || github.event.inputs.branch == 'front' }}
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'

    # Установка зависимостей для frontend (только для front ветки)
    - name: Install frontend dependencies
      if: ${{ github.ref_name == 'front' || github.event.inputs.branch == 'front' }}
      run: |
        if [ -f "package.json" ]; then
          npm ci
        elif [ -f "front/package.json" ]; then
          cd front && npm ci
        fi
      continue-on-error: true

    # Восстановление зависимостей для backend (только для back ветки)
    - name: Restore .NET dependencies
      if: ${{ github.ref_name == 'back' || github.event.inputs.branch == 'back' }}
      run: |
        if [ -f "*.sln" ]; then
          dotnet restore
        elif [ -f "back/*.sln" ]; then
          cd back && dotnet restore
        else
          find . -name "*.csproj" -exec dotnet restore {} \;
        fi
      continue-on-error: true
    # 👆👆👆 КОНЕЦ БЛОКА ДЛЯ ВСТАВКИ 👆👆👆

    # Инициализация CodeQL с выбором языка на основе ветки
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ (github.ref_name == 'front' && 'javascript-typescript') || (github.ref_name == 'back' && 'csharp') || 'javascript-typescript' }}
        queries: security-extended

    # Авто-билд
    - name: Autobuild
      uses: github/codeql-action/autobuild@v3
      continue-on-error: true

    # Выполнение анализа
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        upload: false

    # Сохранение результатов
    - name: Upload SARIF artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: codeql-results-${{ github.ref_name }}
        path: results/*.sarif

    # Загрузка в GitHub Security tab
    - name: Upload to GitHub Security
      uses: github/codeql-action/upload-sarif@v3
      if: always()
      with:
        sarif_file: results/*.sarif
