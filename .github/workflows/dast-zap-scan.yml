name: OWASP ZAP DAST Scan

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to scan'
        required: true
        default: 'back'
        type: choice
        options:
          - back

permissions:
  contents: read
  security-events: write

jobs:
  dast-scan-backend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Create shared network
        run: |
          docker network create dast-network || true
          
      - name: Start PostgreSQL container
        run: |
          docker run -d \
            --name postgres-dast \
            --network dast-network \
            -e POSTGRES_DB=RecipeBookDb \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=1 \
            -p 5432:5432 \
            postgres:15-alpine
          
          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..30}; do
            if docker exec postgres-dast pg_isready -U postgres -d RecipeBookDb > /dev/null 2>&1; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Attempt $i/30 - Waiting for PostgreSQL..."
            sleep 2
          done
          
      - name: Build backend Docker image
        run: |
          docker build -t backend-api:test \
            --build-arg ASPNETCORE_ENVIRONMENT=Testing \
            -f Dockerfile .

      - name: Run backend container
        run: |
          docker run -d \
            --name backend-api \
            --network dast-network \
            -p 5122:5122 \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e ASPNETCORE_URLS=http://+:5122 \
            -e ConnectionStrings__DefaultConnection="Host=postgres-dast;Port=5432;Database=RecipeBookDb;Username=postgres;Password=1" \
            backend-api:test
          
          echo "Waiting for backend to be ready..."
          for i in {1..5}; do
            sleep 3
          done
          
      - name: Run database migrations
        run: |
          docker run --rm \
            --network dast-network \
            -v $(pwd):/src \
            -w /src/RecipeBook \
            mcr.microsoft.com/dotnet/sdk:8.0 \
            sh -c "dotnet tool install --global dotnet-ef --version 9.0.14 && export PATH=\"\$PATH:/root/.dotnet/tools\" && dotnet ef database update --connection 'Host=postgres-dast;Port=5432;Database=RecipeBookDb;Username=postgres;Password=1' --project RecipeBook.csproj"
          echo "Migrations completed"
          
      - name: Download OpenAPI spec
        run: |
          sleep 10
          curl -o openapi.json http://localhost:5122/swagger/v1/swagger.json
          echo "OpenAPI spec downloaded"

      - name: Create ZAP API config
        run: |
          cat > zap-api-config.conf << EOF
          api.file	/zap/wrk/openapi.json	INFO
          api.importFile	/zap/wrk/openapi.json	INFO
          spider.maxDuration	5
          spider.maxDepth	5
          automation.spider.maxDuration	5
          automation.spider.maxDepth	5
          EOF
          echo "Created config file:"
          cat zap-api-config.conf
          echo "OpenAPI spec exists:"
          ls -la openapi.json
      
      - name: Run OWASP ZAP Full Scan with API context
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          target: 'http://localhost:5122'
          cmd_options: >
            -a
            -T 60
            -j
            -r report.html
            -w report.md
            -J report.json
            -d
            -z "-config api.file=/zap/wrk/openapi.json -config api.importFile=/zap/wrk/openapi.json"
          token: ${{ secrets.GITHUB_TOKEN }}
          issue_title: "ZAP Full Scan Results - ${{ github.ref_name }}"
          fail_action: false
          allow_issue_writing: true
          
      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: results.sarif
          
      - name: Upload ZAP Reports as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-reports-${{ github.ref_name }}-${{ github.run_id }}
          path: |
            *.html
            report.json
            
      - name: Cleanup containers
        if: always()
        run: |
          docker stop backend-api postgres-dast || true
          docker rm backend-api postgres-dast || true
          docker network rm dast-network || true
