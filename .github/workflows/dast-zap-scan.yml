name: OWASP ZAP DAST Scan

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to scan'
        required: true
        default: 'back'
        type: choice
        options:
          - back

permissions:
  contents: read
  security-events: write

jobs:
  dast-scan-backend:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Start PostgreSQL container
        run: |
          docker run -d \
            --name postgres-dast \
            -e POSTGRES_DB=RecipeBookDb \
            -e POSTGRES_USER=postgres \
            -e POSTGRES_PASSWORD=1 \
            -p 5432:5432 \
            postgres:15-alpine
          
          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..30}; do
            if docker exec postgres-dast pg_isready -U postgres -d RecipeBookDb > /dev/null 2>&1; then
              echo "PostgreSQL is ready!"
              break
            fi
            echo "Attempt $i/30 - Waiting for PostgreSQL..."
            sleep 2
          done
          
      - name: Build backend Docker image
        run: |
          docker build -t backend-api:test \
            --build-arg ASPNETCORE_ENVIRONMENT=Testing \
            -f Dockerfile .
          
      - name: Run backend container
        run: |
          docker run -d \
            --name backend-api \
            -p 5122:5122 \
            --link postgres-dast:postgres-dast \
            -e ASPNETCORE_ENVIRONMENT=Development \
            -e ASPNETCORE_URLS=http://+:5122 \
            -e ConnectionStrings__DefaultConnection="Host=postgres-dast;Port=5432;Database=RecipeBookDb;Username=postgres;Password=1" \
            backend-api:test
          
          echo "Waiting for backend to be ready..."
          for i in {1..5}; do
            sleep 3
          done
          
      - name: Run database migrations
        run: |
          # Убедимся, что у нас есть файлы проекта
          docker run --rm \
            --network container:backend-api \
            -v $(pwd):/src \
            -w /src \
            mcr.microsoft.com/dotnet/sdk:8.0 \
            bash -c "dotnet restore && dotnet tool restore && dotnet ef database update --connection 'Host=postgres-dast;Port=5432;Database=RecipeBookDb;Username=postgres;Password=1'"
          echo "Migrations completed"
          
      - name: Run OWASP ZAP API Scan
        uses: zaproxy/action-api-scan@v0.10.0
        with:
          target: 'http://localhost:5122'
          api_url: 'http://localhost:5122/swagger/v1/swagger.json'
          cmd_options: '-a -t 30'
          
      - name: Convert ZAP Results to SARIF
        uses: zaproxy/action-full-scan@v0.13.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif
          
      - name: Upload ZAP Reports as Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-reports-${{ github.ref_name }}-${{ github.run_id }}
          path: |
            *.html
            report.json
            
      - name: Cleanup containers
        if: always()
        run: |
          docker stop backend-api postgres-dast || true
          docker rm backend-api postgres-dast || true
